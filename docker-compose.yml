services:
  banco:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: senha
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - dados_postgres:/var/lib/postgresql/data

  back:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:senha@banco:5432/postgres"
    depends_on:
      - banco

  front:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - back

volumes:
  dados_postgres: